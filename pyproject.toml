[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "molforge-studio"
version = "7.4.1"
description = "MolForge Studio: Unified molecular science workstation (2D sketcher, 3D modeler, quantum chemistry & MD, LLM assistant)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "MolForge Team", email = "yangdw2021@gmail.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Visualization",
]
keywords = [
    "chemistry",
    "molecular-editor",
    "chemdraw",
    "chem3d",
    "gaussview",
    "vmd",
    "multiwfn",
    "quantum-chemistry",
    "computational-chemistry"
]
dependencies = [
    "numpy>=1.24",
    "rdkit>=2023.09",
    "PyQt6>=6.5",
    "pyvista>=0.40",
    "pyvistaqt>=0.11",
    "scipy>=1.10",
]

[project.optional-dependencies]
ai = [
    "requests>=2.28",
    "pydantic>=2.0",
]
all = [
    "matplotlib>=3.7",
    "requests>=2.28",
    "pydantic>=2.0",
]

[project.scripts]
molforge = "main:main"
molforge-studio = "main:main"

[project.urls]
Homepage = "https://github.com/yangdw2024/MolForge"
Repository = "https://github.com/yangdw2024/MolForge.git"
Issues = "https://github.com/yangdw2024/MolForge/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["molforge*"]
