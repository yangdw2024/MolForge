[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "molforge-studio"
version = "8.1.0"
description = "MolForge Studio 8.1.0 CLI launcher, GitHub binary fetcher, and Rust core HTTP SDK (Electron 35 + WebGPU + CalChem v0.3.0)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "MolForge Team (yangdw2024)", email = "yangdw2021@gmail.com" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
]
keywords = [
    "molforge",
    "chemistry",
    "molecular-editor",
    "quantum-chemistry",
    "calchem",
    "multiwfn",
    "webgpu",
    "computational-chemistry",
]
dependencies = []

[project.scripts]
molforge = "molforge_studio_cli.cli:main"
molforge-studio = "molforge_studio_cli.cli:main"

[project.urls]
Homepage = "https://github.com/yangdw2024/MolForge"
Repository = "https://github.com/yangdw2024/MolForge.git"
Releases = "https://github.com/yangdw2024/MolForge/releases"
Issues = "https://github.com/yangdw2024/MolForge/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["molforge_studio_cli*"]
